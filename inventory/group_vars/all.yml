---
# ============================================================================
# ESTADO DECLARADO DEL LABORATORIO — ansible-netlab-v2
#
# Una sola fuente de verdad. Este fichero declara QUÉ existe y CÓMO está; los
# verbos (playbooks/*.yml) lo llevan a la realidad y lo verifican. Nada se toca
# por SSH al hipervisor: todo va por la API de Proxmox y por la API de RouterOS.
#
# ---------------------------------------------------------------------------
# QUÉ CAMBIA RESPECTO A LA v1 (proxmox-ansible-lxc-test)
# ---------------------------------------------------------------------------
#   1. Numeración de CUATRO dígitos en todos los invitados, con la ubicación
#      primero y el tipo de equipo después:   S T NN
#         S  = sede / ubicación   0=infra  1=central  2=delegación-2  3=delegación-3  9=borde
#         T  = tipo de equipo     1=firewall  2=router  3=switch  4=workstation  9=servicio
#         NN = índice dentro de ese tipo y sede
#      Así `1301` se lee "sede 1, switch, el primero" y `1401` "sede 1,
#      workstation, la primera". El número dice dónde está y qué es.
#
#   2. DISTINCIÓN DE FUNCIONES POR MÁQUINA. En la v1 cada sede tenía un router
#      que lo hacía todo. Aquí cada función es un equipo:
#        - el SWITCH   conmuta (L2), no enruta ni filtra;
#        - el ROUTER   enruta DENTRO de la empresa (entre sedes), no filtra;
#        - el FIREWALL filtra el PERÍMETRO y es la puerta de enlace de su LAN.
#      El camino de un paquete en una sede es:  pc -> sw -> fw -> rt -> WAN.
#
#   3. SALIDA A INTERNET. La v1 era una red cerrada a propósito. La v2 tiene un
#      firewall de borde (`fw-wan-edge`) que sale por la red de gestión hacia el
#      host Proxmox (10.10.10.1) — el único gateway real del nodo — y hace NAT
#      (masquerade) para toda la empresa. NO se pone ningún invitado en vmbr0
#      (el bridge público): la salida va por la LAN de gestión, nunca exponiendo
#      la máquina a internet directamente.
#
#   4. NOMBRES DESCRIPTIVOS: sw-s1-acc-01, rt-s2-edge, fw-s3-perim, pc-s1-01,
#      fw-wan-edge, infra-bootstrap. El nombre dice el tipo, la sede y la
#      función; no hay que consultar nada para saber qué es cada máquina.
#
#   5. LO QUE NO ESTÁ, A PROPÓSITO. Este manifiesto describe una EMPRESA, y sólo
#      contiene eso: la topología de red, las estaciones de trabajo y el equipo
#      que da de comer a los routers. Quedan fuera, y no se recrean:
#        - `ct-forge-5f2a` (167): contenedor de pruebas del motor con atributos
#          aleatorios. Servía para probar el framework, no forma parte del lab.
#        - `wiki-tiddly` (131): el servidor de documentación de la v1.
#        - `caddy` (101): invitado preexistente. No aparece aquí en ninguna lista.
#      Los invitados de la v1 tampoco se declaran: la convergencia NUNCA borra,
#      así que seguir corriendo no los altera. Se retiran a mano desde la UI.
# ============================================================================

pve_node: Proxmox

# ---------------------------------------------------------------------------
# DIRECCIONAMIENTO
#
# Todas las direcciones de GESTIÓN viven en 10.10.10.0/24 (vmbr1), cuya puerta
# es el host Proxmox (10.10.10.1). Ese /24 no se puede ampliar sin reconfigurar
# el host, y el host no se toca (ver .hermes.md), así que la regla de la v1
# ("el último octeto es el vmid") NO cabe con cuatro dígitos: aquí las
# direcciones de gestión se asignan por BLOQUES DE FUNCIÓN, que es lo que hace
# legible un direccionamiento cuando crece.
#
#   10.10.10.1      el host Proxmox (NO es nuestro; es el gateway)
#   10.10.10.2      caddy (invitado preexistente, AJENO a este repositorio)
#   10.10.10.11-19  switches      (ST = 13/23/33)
#   10.10.10.21-29  routers       (ST = 12/22/32)
#   10.10.10.31-39  firewalls     (ST = 11/21/31, y el de borde 91)
#   10.10.10.41-49  infraestructura (ST = 09)
# ---------------------------------------------------------------------------
lab_mgmt_network: "10.10.10.0/24"
lab_mgmt_gateway: "10.10.10.1"

# LAN de cada sede. Como en la v1, cada sede es su propia red: un paquete de una
# sede a otra tiene que cruzar la topología, no hay atajo.
lab_site1_network: "10.11.0.0/24"
lab_site1_gateway: "10.11.0.1"
lab_site1_pool: "10.11.0.100-10.11.0.199"
lab_site2_network: "10.12.0.0/24"
lab_site2_gateway: "10.12.0.1"
lab_site2_pool: "10.12.0.100-10.12.0.199"
lab_site3_network: "10.13.0.0/24"
lab_site3_gateway: "10.13.0.1"
lab_site3_pool: "10.13.0.100-10.13.0.199"

# Enlaces WAN punto a punto entre la central y cada delegación (dos /30, no un
# segmento compartido: es la forma de que una sede nueva no toque las demás).
lab_wan1_network: "10.99.1.0/30"
lab_wan1_hub: "10.99.1.1"
lab_wan1_spoke: "10.99.1.2"
lab_wan2_network: "10.99.2.0/30"
lab_wan2_hub: "10.99.2.1"
lab_wan2_spoke: "10.99.2.2"

# Tránsitos firewall<->router de cada sede, uno por sede (/30). Es el cable que
# separa LITERALMENTE la LAN del equipo que filtra.
lab_tr1_network: "10.21.0.0/30"
lab_tr1_fw: "10.21.0.1"
lab_tr1_rt: "10.21.0.2"
lab_tr2_network: "10.22.0.0/30"
lab_tr2_fw: "10.22.0.1"
lab_tr2_rt: "10.22.0.2"
lab_tr3_network: "10.23.0.0/30"
lab_tr3_fw: "10.23.0.1"
lab_tr3_rt: "10.23.0.2"

# El borde de la empresa: el núcleo entrega aquí todo lo que sale, y el firewall
# de borde lo NAT-ea hacia la red de gestión.
lab_edge_network: "10.29.0.0/30"
lab_edge_core: "10.29.0.1"
lab_edge_fw: "10.29.0.2"

# El "proveedor de internet" es el propio host Proxmox: es el único que tiene
# salida real. El firewall de borde le pide la ruta por defecto a él.
lab_internet_gateway: "10.10.10.1"
lab_internet_dns: "1.1.1.1"

# Red del nodo de control (el túnel). No es una red de la empresa: es el camino
# por el que ESTE nodo entra a gestionar.
lab_control_network: "10.99.99.0/24"
lab_control_via: "10.10.10.1"

# ---------------------------------------------------------------------------
# CLAVE DE AUTOMATIZACIÓN (fuera del repositorio; aquí sólo su RUTA)
# ---------------------------------------------------------------------------
pve_ssh_pubkey_path: "/home/hermes/.hermes/profiles/hermione/secrets/pve-automation_ed25519.pub"

# ---------------------------------------------------------------------------
# TÚNEL DE GESTIÓN (WireGuard)
#
# El control node no está en la LAN del laboratorio: entra por un túnel cuyo
# extremo vive en el host Proxmox. La mitad del host NO la puede configurar la
# API (sería ejecutar código en el hipervisor), así que se pega UNA vez con
# playbooks/tools/wg_endpoint_setup.sh — incluida la ruta por sede, que es el
# último argumento.
# ---------------------------------------------------------------------------
pve_tunnel:
  manage: true
  name: wg-lab
  endpoint: "54.36.168.83:51820"
  endpoint_public_key: "3+bBS+GqR4EtWUFst+2s49rneVguWquuRBGINt/tZXQ="
  address: "10.99.99.2/24"
  guest_network:
    - "10.10.10.0/24"   # la LAN de gestión (host y patas de gestión)
    - "10.11.0.0/24"    # SEDE 1 (central), detrás de fw-s1-perim
    - "10.12.0.0/24"    # SEDE 2, detrás de fw-s2-perim
    - "10.13.0.0/24"    # SEDE 3, detrás de fw-s3-perim
  # Rutas que el ENDPOINT (el host) necesita para entregar el tráfico del túnel
  # a cada LAN de sede. Se llega a la red de una sede por la pata de gestión de
  # su router, que es como se llega en la vida real.
  endpoint_routes:
    - to: "{{ lab_site1_network }}"
      via: "10.10.10.21"   # rt-s1-core
    - to: "{{ lab_site2_network }}"
      via: "10.10.10.22"   # rt-s2-edge
    - to: "{{ lab_site3_network }}"
      via: "10.10.10.23"   # rt-s3-edge
  private_key_path: "/home/hermes/.hermes/profiles/hermione/secrets/wg-lab-client"
  keepalive: 25

# ---------------------------------------------------------------------------
# SEGMENTOS DEL HOST (bridges, los "cables")
#
# Uno por CABLE, aislado (sin puertos de uplink), y el nombre del bridge aparece
# literal en sus dos puntas. El motor sólo CREA bridges: los que dejan de
# declararse se quedan en el host y se retiran por la API.
#
# Se reutilizan vmbr4..vmbr17 (ya existen en el nodo) y se añaden vmbr18..21.
# El comentario de los segmentos que YA existen no lo reescribe el motor (sólo
# crea), así que lo pone este repositorio con una llamada aparte
# (playbooks/tools/segment_comments.py), que es lo que hace que los comentarios
# de la v2 se lean también en la interfaz de Proxmox.
# ---------------------------------------------------------------------------
pve_bridges:
  # ---- SEDE 1 (central) -----------------------------------------------------
  - iface: vmbr4
    comments: "cable: pc-s1-01 eth0 <-> sw-s1-acc-01 ether2"
  - iface: vmbr5
    comments: "cable: pc-s1-02 eth0 <-> sw-s1-acc-01 ether3"
  - iface: vmbr6
    comments: "cable: pc-s1-03 eth0 <-> sw-s1-acc-02 ether2"
  - iface: vmbr7
    comments: "cable: pc-s1-04 eth0 <-> sw-s1-acc-02 ether3"
  - iface: vmbr8
    comments: "cable: sw-s1-acc-01 ether4 <-> sw-s1-acc-02 ether4 (troncal L2)"
  - iface: vmbr9
    comments: "cable: sw-s1-acc-01 ether5 <-> fw-s1-perim ether2 (la LAN de la sede hacia su firewall)"
  - iface: vmbr10
    comments: "cable: fw-s1-perim ether3 <-> rt-s1-core ether2 (transito 10.21.0.0/30)"
  - iface: vmbr11
    comments: "WAN 1: rt-s1-core ether3 <-> rt-s2-edge ether3 (10.99.1.0/30)"
  - iface: vmbr12
    comments: "WAN 2: rt-s1-core ether4 <-> rt-s3-edge ether3 (10.99.2.0/30)"
  - iface: vmbr13
    comments: "cable: rt-s1-core ether5 <-> fw-wan-edge ether2 (transito de borde 10.29.0.0/30)"
  # ---- SEDE 2 (delegacion) --------------------------------------------------
  - iface: vmbr14
    comments: "cable: pc-s2-01 eth0 <-> sw-s2-acc-01 ether2"
  - iface: vmbr15
    comments: "cable: pc-s2-02 eth0 <-> sw-s2-acc-01 ether3"
  - iface: vmbr16
    comments: "cable: sw-s2-acc-01 ether4 <-> fw-s2-perim ether2"
  - iface: vmbr17
    comments: "cable: fw-s2-perim ether3 <-> rt-s2-edge ether2 (transito 10.22.0.0/30)"
  # ---- SEDE 3 (delegacion) --------------------------------------------------
  - iface: vmbr18
    comments: "cable: pc-s3-01 eth0 <-> sw-s3-acc-01 ether2"
  - iface: vmbr19
    comments: "cable: pc-s3-02 eth0 <-> sw-s3-acc-01 ether3"
  - iface: vmbr20
    comments: "cable: sw-s3-acc-01 ether4 <-> fw-s3-perim ether2"
  - iface: vmbr21
    comments: "cable: fw-s3-perim ether3 <-> rt-s3-edge ether2 (transito 10.23.0.0/30)"

# ---------------------------------------------------------------------------
# CONTENEDORES (LXC)
# ---------------------------------------------------------------------------
pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped. En marcha: aplicar la declaración ES levantar el
  # laboratorio, y ese es el sentido de tenerlo declarado.
  status: started

  # ---- resources (converged in place) --------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  cpuunits: 1024

  # ---- behaviour (converged in place) --------------------------------------
  onboot: false
  description: "Managed by ansible-netlab-v2. Declare changes in inventory/group_vars/all.yml."
  # Etiqueta base; cada invitado AÑADE las suyas (sede y papel) a esta lista.
  tags: [netlab, ansible-managed]
  timezone: host
  cmode: shell
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth ----------------------------------------------------
  pubkey: "{{ lookup('file', pve_ssh_pubkey_path, errors='ignore') | default('', true) | trim }}"

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
pve_containers:
  # ==========================================================================
  # 09xx — INFRAESTRUCTURA
  #
  # Lo mínimo para que el laboratorio nazca: el equipo que da a los routers su
  # primera dirección. No hay más servicios: esto describe una red de empresa,
  # no un parque de aplicaciones.
  # ==========================================================================

  # infra-bootstrap: concede a cada equipo de red su primera dirección por DHCP,
  # atada a su MAC, para que su API REST exista desde el primer arranque. Vive
  # en la LAN de gestión. Es la SALA DE PARTOS, no una dependencia de
  # funcionamiento: una vez cada equipo tiene su dirección, no interviene.
  - vmid: 901
    hostname: infra-bootstrap
    cores: 1
    memory: 1024
    rootfs_size: 4
    swap: 256
    onboot: true
    startup: ["order=1"]
    tags: [netlab, ansible-managed, infra, bootstrap, dhcp, sin-sede]
    description: "Da a cada equipo de red su primera direccion por DHCP (atada a su MAC). No hace nada mas."
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.41/24"
    manage: true
    config:
      bootstrap:
        interface: eth0
        # A qué tiene que saber VOLVER: las redes de las tres sedes. Sin esto
        # recibe los pings de una workstation y no puede contestarlos, porque su
        # ruta por defecto va al host y el host no enruta hacia el interior. El
        # gateway es el núcleo, que es el que conoce las tres sedes.
        routes:
          - "{{ lab_site1_network }}"
          - "{{ lab_site2_network }}"
          - "{{ lab_site3_network }}"
        route_gateway: "10.10.10.21"   # rt-s1-core
        hosts: >-
          {%- set out = [] -%}
          {%- for v in pve_vms | selectattr('chr', 'defined') -%}
          {%-   set mac = v.net.net0 | regex_replace('^.*virtio=([0-9A-Fa-f:]{17}).*$', '\\1') -%}
          {%-   set mgmt = v.config.routeros.addresses
                          | selectattr('interface', 'equalto', 'ether1') | first -%}
          {%-   set _ = out.append({'mac': mac,
                                    'address': mgmt.address.split('/')[0],
                                    'name': v.name}) -%}
          {%- endfor -%}
          {{ out }}

  # ==========================================================================
  # 14xx / 24xx / 34xx — LAS OCHO WORKSTATIONS
  #
  # Cada una es un PC: UNA sola NIC, en su propio segmento aislado (el latiguillo
  # hacia su switch) y SIN interfaz de gestión. Así se hace en una empresa: un PC
  # de oficina tiene un interfaz y recibe su dirección por DHCP; nadie le pone un
  # segundo NIC "de gestión" ni entra en él por SSH desde la red.
  #
  # Su dirección se la da por DHCP el FIREWALL de su sede (es el perímetro y la
  # puerta de enlace de la LAN), con una reserva atada a su MAC declarada aquí.
  # ==========================================================================

  - vmid: 1401
    hostname: pc-s1-01
    site: sede1
    address: "10.11.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede1, central]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 1 de la central: una sola NIC en el cable hacia sw-s1-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr4,hwaddr=BC:24:11:00:51:01,ip=dhcp"

  - vmid: 1402
    hostname: pc-s1-02
    site: sede1
    address: "10.11.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede1, central]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 2 de la central: una sola NIC en el cable hacia sw-s1-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr5,hwaddr=BC:24:11:00:51:02,ip=dhcp"

  - vmid: 1403
    hostname: pc-s1-03
    site: sede1
    address: "10.11.0.13"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede1, central]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 3 de la central: cuelga de sw-s1-acc-02, al otro lado del troncal."
    netif:
      net0: "name=eth0,bridge=vmbr6,hwaddr=BC:24:11:00:51:03,ip=dhcp"

  - vmid: 1404
    hostname: pc-s1-04
    site: sede1
    address: "10.11.0.14"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede1, central]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 4 de la central: cuelga de sw-s1-acc-02."
    netif:
      net0: "name=eth0,bridge=vmbr7,hwaddr=BC:24:11:00:51:04,ip=dhcp"

  - vmid: 2401
    hostname: pc-s2-01
    site: sede2
    address: "10.12.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede2, delegacion]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 1 de la delegacion 2: una sola NIC en el cable hacia sw-s2-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr14,hwaddr=BC:24:11:00:52:01,ip=dhcp"

  - vmid: 2402
    hostname: pc-s2-02
    site: sede2
    address: "10.12.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede2, delegacion]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 2 de la delegacion 2: una sola NIC en el cable hacia sw-s2-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr15,hwaddr=BC:24:11:00:52:02,ip=dhcp"

  - vmid: 3401
    hostname: pc-s3-01
    site: sede3
    address: "10.13.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede3, delegacion]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 1 de la delegacion 3: una sola NIC en el cable hacia sw-s3-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr18,hwaddr=BC:24:11:00:53:01,ip=dhcp"

  - vmid: 3402
    hostname: pc-s3-02
    site: sede3
    address: "10.13.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [netlab, ansible-managed, workstation, sede3, delegacion]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 2 de la delegacion 3: una sola NIC en el cable hacia sw-s3-acc-01."
    netif:
      net0: "name=eth0,bridge=vmbr19,hwaddr=BC:24:11:00:53:02,ip=dhcp"

# ============================================================================
# QEMU VMs — mismas reglas declarativas que los contenedores, con una
# diferencia: proxmox_kvm se niega a actualizar net/scsi/ide/sata/virtio (y
# bios/machine/scsihw/ostype), así que para una VM son creation-time: la deriva
# en ellos se RECHAZA, no se converge.
# ============================================================================
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  status: stopped

  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by ansible-netlab-v2."
  tags: [netlab, ansible-managed]

  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"

# ---------------------------------------------------------------------------
# CHR (MikroTik RouterOS) — valores por defecto de TODO equipo de red.
#
# Aquí viven el sabor, el orden de arranque y la forma común, porque los equipos
# de red son once y repetir eso en cada uno es pedir que se desincronicen. Cada
# equipo AÑADE sus propias etiquetas (sede y papel) sin repetir estas.
#
# Los equipos de red van ANTES que las workstations: la petición DHCP de una
# workstation la contesta el firewall de su sede, así que arrancarlos juntos es
# una carrera que la workstation pierde.
# ---------------------------------------------------------------------------
pve_chr_defaults:
  onboot: true
  startup: ["order=2"]
  # 1 core y 256 MiB por equipo de red: un CHR que conmuta, enruta o filtra
  # (que es todo lo que hace) no necesita más, y ahora son once.
  cores: 1
  memory: 256
  # En marcha: aplicar la declaración ES levantar el laboratorio.
  status: started
  manage: true
  # La imagen del fabricante no tiene cloud-init, así que esa unidad sería peso
  # muerto.
  cloudinit: false
  # CHR es una imagen de la era i440fx: arranca en el chipset PC, no en q35.
  machine: pc
  # La imagen importada es el ÚNICO disco, así que es el dispositivo de arranque
  # (el orden por defecto espera la unidad cloud-init que esta VM no tiene).
  boot: "order=scsi0"
  scsi:
    # 1 GiB y no 8: la imagen del fabricante ocupa 128 MiB y RouterOS CHR vive en
    # RAM, así que un disco grande aquí es espacio asignado que nadie usa.
    scsi0: "local-zfs:1"
  # La imagen del fabricante se IMPORTA en vez de crearse: proxmox_kvm sólo sabe
  # construir un disco a partir de un tamaño, así que la imagen raw está subida a
  # un storage que acepta `import` y se adjunta con la sintaxis import-from de la
  # API en el momento de crear la VM (ver playbooks/tasks/disk_import.yml).
  # `key` es el disco que la imagen rellena.
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # La consola que respeta un teclado que no es US: lleva CARACTERES, no
  # scancodes. `vga: serial0` es lo que hace que el botón Console de PVE abra
  # esta consola en vez de un noVNC que no tiene nada que mostrar.
  serial:
    serial0: socket
  vga: serial0
  # SIN `keyboard:` a propósito: sólo cambiaría cómo el VNC convierte las teclas
  # del navegador, y la última traducción es la del propio invitado (RouterOS es
  # US y no tiene ajuste).
  description: "MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST."
  tags: [netlab, routeros, red, ansible-managed]

pve_vms:
  # ==========================================================================
  # SWITCHES (ST = 3S) — conmutan. No enrutan ni filtran.
  # ==========================================================================

  # sw-s1-acc-01: primer switch de acceso de la central. Une pc-s1-01 y pc-s1-02
  # y entrega la sede a su firewall. El troncal hacia el segundo switch va por
  # ether4.
  - vmid: 1301
    name: sw-s1-acc-01
    chr: true
    tags: [netlab, routeros, red, ansible-managed, switch, sede1, central]
    net:
      net0: "virtio=BC:24:11:00:31:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:31:02,bridge=vmbr4"    # ether2 -> pc-s1-01
      net2: "virtio=BC:24:11:00:31:03,bridge=vmbr5"    # ether3 -> pc-s1-02
      net3: "virtio=BC:24:11:00:31:04,bridge=vmbr8"    # ether4 -> sw-s1-acc-02 (troncal)
      net4: "virtio=BC:24:11:00:31:05,bridge=vmbr9"    # ether5 -> fw-s1-perim (la LAN de la sede)
    config:
      routeros:
        identity: sw-s1-acc-01
        addresses:
          - address: "10.10.10.11/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4, ether5]
        dhcp_client: false
        # La puerta de enlace de gestión apunta al firewall de su sede: es el
        # perímetro y el único que sabe salir. Es lo que convierte al switch en
        # un equipo gestionable de verdad.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.31"

  # sw-s1-acc-02: segundo switch de acceso de la central. Cuelga del troncal
  # (mismo dominio L2, que es lo que hace que las cuatro workstations de la sede
  # compartan una sola red).
  - vmid: 1302
    name: sw-s1-acc-02
    chr: true
    tags: [netlab, routeros, red, ansible-managed, switch, sede1, central]
    net:
      net0: "virtio=BC:24:11:00:32:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:32:02,bridge=vmbr6"    # ether2 -> pc-s1-03
      net2: "virtio=BC:24:11:00:32:03,bridge=vmbr7"    # ether3 -> pc-s1-04
      net3: "virtio=BC:24:11:00:32:04,bridge=vmbr8"    # ether4 -> sw-s1-acc-01 (troncal)
    config:
      routeros:
        identity: sw-s1-acc-02
        addresses:
          - address: "10.10.10.12/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.31"

  # sw-s2-acc-01: el switch de acceso de la delegación 2.
  - vmid: 2301
    name: sw-s2-acc-01
    chr: true
    tags: [netlab, routeros, red, ansible-managed, switch, sede2, delegacion]
    net:
      net0: "virtio=BC:24:11:00:33:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:33:02,bridge=vmbr14"   # ether2 -> pc-s2-01
      net2: "virtio=BC:24:11:00:33:03,bridge=vmbr15"   # ether3 -> pc-s2-02
      net3: "virtio=BC:24:11:00:33:04,bridge=vmbr16"   # ether4 -> fw-s2-perim
    config:
      routeros:
        identity: sw-s2-acc-01
        addresses:
          - address: "10.10.10.13/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.32"

  # sw-s3-acc-01: el switch de acceso de la delegación 3.
  - vmid: 3301
    name: sw-s3-acc-01
    chr: true
    tags: [netlab, routeros, red, ansible-managed, switch, sede3, delegacion]
    net:
      net0: "virtio=BC:24:11:00:34:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:34:02,bridge=vmbr18"   # ether2 -> pc-s3-01
      net2: "virtio=BC:24:11:00:34:03,bridge=vmbr19"   # ether3 -> pc-s3-02
      net3: "virtio=BC:24:11:00:34:04,bridge=vmbr20"   # ether4 -> fw-s3-perim
    config:
      routeros:
        identity: sw-s3-acc-01
        addresses:
          - address: "10.10.10.14/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.33"

  # ==========================================================================
  # FIREWALLS (ST = 1S, y 91 el de borde) — filtran el PERÍMETRO y son la
  # puerta de la LAN.
  #
  # Cada firewall de sede tiene su pata "inside" en la LAN de la sede (es su
  # puerta de enlace y su servidor DHCP) y su pata "outside" en el tránsito
  # hacia el router de la sede. El firewall de borde hace lo mismo de cara al
  # "proveedor": su pata exterior ES la red de gestión, y NAT-ea hacia ella.
  #
  # El bloque `firewall` (filter/nat) lo converge el rol routeros extendido.
  # ==========================================================================

  # fw-s1-perim: perímetro de la central. Es la puerta de enlace de la LAN de la
  # sede 1 (10.11.0.1) y quien reparte las direcciones de sus workstations.
  - vmid: 1101
    name: fw-s1-perim
    chr: true
    tags: [netlab, routeros, red, ansible-managed, firewall, perimetro, sede1, central]
    net:
      net0: "virtio=BC:24:11:00:41:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:41:02,bridge=vmbr9"    # ether2 -> sw-s1-acc-01 (LAN de la sede)
      net2: "virtio=BC:24:11:00:41:03,bridge=vmbr10"   # ether3 -> rt-s1-core (transito)
    config:
      routeros:
        identity: fw-s1-perim
        addresses:
          - address: "10.10.10.31/24"
            interface: ether1
          - address: "{{ lab_site1_gateway }}/24"
            interface: ether2
          - address: "{{ lab_tr1_fw }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_tr1_rt }}"
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_tr1_rt }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_tr1_rt }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede1
            interface: ether2
            address_pool: "{{ lab_site1_pool }}"
            network: "{{ lab_site1_network }}"
            gateway: "{{ lab_site1_gateway }}"
            dns_server: "{{ lab_internet_dns }}"
            # Una reserva por workstation DE ESTA SEDE. Dirección y MAC salen de
            # la declaración de la propia workstation: aquí no se repite ningún
            # valor, así que no pueden desincronizarse.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede1') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}
        # Perímetro: lo establecido pasa, de dentro a fuera pasa, y lo demás que
        # se inicia se descarta. Es el filtrado mínimo honesto de un firewall de
        # borde de sede.
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether3}

  # fw-s2-perim: perímetro de la delegación 2.
  - vmid: 2101
    name: fw-s2-perim
    chr: true
    tags: [netlab, routeros, red, ansible-managed, firewall, perimetro, sede2, delegacion]
    net:
      net0: "virtio=BC:24:11:00:42:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:42:02,bridge=vmbr16"   # ether2 -> sw-s2-acc-01 (LAN de la sede)
      net2: "virtio=BC:24:11:00:42:03,bridge=vmbr17"   # ether3 -> rt-s2-edge (transito)
    config:
      routeros:
        identity: fw-s2-perim
        addresses:
          - address: "10.10.10.32/24"
            interface: ether1
          - address: "{{ lab_site2_gateway }}/24"
            interface: ether2
          - address: "{{ lab_tr2_fw }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_tr2_rt }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede2
            interface: ether2
            address_pool: "{{ lab_site2_pool }}"
            network: "{{ lab_site2_network }}"
            gateway: "{{ lab_site2_gateway }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede2') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether3}

  # fw-s3-perim: perímetro de la delegación 3.
  - vmid: 3101
    name: fw-s3-perim
    chr: true
    tags: [netlab, routeros, red, ansible-managed, firewall, perimetro, sede3, delegacion]
    net:
      net0: "virtio=BC:24:11:00:43:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:43:02,bridge=vmbr20"   # ether2 -> sw-s3-acc-01 (LAN de la sede)
      net2: "virtio=BC:24:11:00:43:03,bridge=vmbr21"   # ether3 -> rt-s3-edge (transito)
    config:
      routeros:
        identity: fw-s3-perim
        addresses:
          - address: "10.10.10.33/24"
            interface: ether1
          - address: "{{ lab_site3_gateway }}/24"
            interface: ether2
          - address: "{{ lab_tr3_fw }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_tr3_rt }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede3
            interface: ether2
            address_pool: "{{ lab_site3_pool }}"
            network: "{{ lab_site3_network }}"
            gateway: "{{ lab_site3_gateway }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede3') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether3}

  # fw-wan-edge: el firewall de BORDE. Es el único que sale de la empresa.
  #
  # Su pata exterior (ether1) es la red de gestión: NO hay un segmento "ISP"
  # inventado, porque el proveedor real es el host Proxmox y vive ahí. NAT-ea
  # (masquerade) todo lo que sale por esa pata, de modo que el laboratorio sale
  # a internet con la dirección del host y ninguna máquina del lab queda
  # expuesta directamente.
  - vmid: 9101
    name: fw-wan-edge
    chr: true
    tags: [netlab, routeros, red, ansible-managed, firewall, borde, internet, sin-sede]
    net:
      net0: "virtio=BC:24:11:00:49:01,bridge=vmbr1"    # ether1 -> "proveedor" (red de gestion)
      net1: "virtio=BC:24:11:00:49:02,bridge=vmbr13"   # ether2 -> rt-s1-core (transito de borde)
    config:
      routeros:
        identity: fw-wan-edge
        addresses:
          - address: "10.10.10.34/24"
            interface: ether1
          - address: "{{ lab_edge_fw }}/30"
            interface: ether2
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_internet_gateway }}"
          - dst_address: "{{ lab_site1_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_internet_gateway }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether1}
            - {chain: forward, action: drop, connection_state: "new"}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether1}

  # ==========================================================================
  # ROUTERS (ST = 2S) — enrutan DENTRO de la empresa. No filtran y no sirven
  # DHCP: eso es del firewall. El router de la central conoce todas las sedes;
  # los de las delegaciones sólo saben salir.
  # ==========================================================================

  # rt-s1-core: el núcleo. Conoce las tres sedes, los dos enlaces WAN y la
  # salida de la empresa.
  - vmid: 1201
    name: rt-s1-core
    chr: true
    tags: [netlab, routeros, red, ansible-managed, router, nucleo, sede1, central]
    net:
      net0: "virtio=BC:24:11:00:21:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:21:02,bridge=vmbr10"   # ether2 -> fw-s1-perim (LAN de la sede 1)
      net2: "virtio=BC:24:11:00:21:03,bridge=vmbr11"   # ether3 -> WAN 1
      net3: "virtio=BC:24:11:00:21:04,bridge=vmbr12"   # ether4 -> WAN 2
      net4: "virtio=BC:24:11:00:21:05,bridge=vmbr13"   # ether5 -> fw-wan-edge (borde)
    config:
      routeros:
        identity: rt-s1-core
        addresses:
          - address: "10.10.10.21/24"
            interface: ether1
          - address: "{{ lab_tr1_rt }}/30"
            interface: ether2
          - address: "{{ lab_wan1_hub }}/30"
            interface: ether3
          - address: "{{ lab_wan2_hub }}/30"
            interface: ether4
          - address: "{{ lab_edge_core }}/30"
            interface: ether5
        dhcp_client: false
        routes:
          # La LAN de su propia sede está DETRÁS de su firewall.
          - dst_address: "{{ lab_site1_network }}"
            gateway: "{{ lab_tr1_fw }}"
          # Las delegaciones, por sus enlaces WAN.
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_wan1_spoke }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_wan2_spoke }}"
          # La vuelta hacia el nodo de control.
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          # Y todo lo demás hacia fuera, por el firewall de borde.
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_edge_fw }}"

  # rt-s2-edge: el router de la delegación 2. Una pata a su firewall, una a la
  # WAN 1, y una ruta POR DEFECTO hacia el núcleo — la configuración real de una
  # delegación, que no necesita saber qué hay al otro lado.
  - vmid: 2201
    name: rt-s2-edge
    chr: true
    tags: [netlab, routeros, red, ansible-managed, router, sede2, delegacion]
    net:
      net0: "virtio=BC:24:11:00:22:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:22:02,bridge=vmbr17"   # ether2 -> fw-s2-perim
      net2: "virtio=BC:24:11:00:22:03,bridge=vmbr11"   # ether3 -> WAN 1
    config:
      routeros:
        identity: rt-s2-edge
        addresses:
          - address: "10.10.10.22/24"
            interface: ether1
          - address: "{{ lab_tr2_rt }}/30"
            interface: ether2
          - address: "{{ lab_wan1_spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_wan1_hub }}"
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_tr2_fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"

  # rt-s3-edge: el router de la delegación 3, simétrico al anterior por la WAN 2.
  - vmid: 3201
    name: rt-s3-edge
    chr: true
    tags: [netlab, routeros, red, ansible-managed, router, sede3, delegacion]
    net:
      net0: "virtio=BC:24:11:00:23:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:23:02,bridge=vmbr21"   # ether2 -> fw-s3-perim
      net2: "virtio=BC:24:11:00:23:03,bridge=vmbr12"   # ether3 -> WAN 2
    config:
      routeros:
        identity: rt-s3-edge
        addresses:
          - address: "10.10.10.23/24"
            interface: ether1
          - address: "{{ lab_tr3_rt }}/30"
            interface: ether2
          - address: "{{ lab_wan2_spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_wan2_hub }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_tr3_fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"

# ============================================================================
# NOTA: no hay lista de "invitados parcialmente adoptados".
#
# La v1 traía `pve_config_targets` con el caddy (101) dentro. Aquí no existe:
# ese invitado es AJENO a este repositorio y no aparece en ninguna lista. Si
# algún día hay que configurar un invitado preexistente desde capa 2, se
# declara aquí y se explica por qué.
# ============================================================================

# ============================================================================
# TIEMPOS DE ENERGÍA (verbos apply/preflight)
# ============================================================================
# Cuánto se espera, como máximo, a que un escalón entero acabe en marcha. El
# lote se pide de golpe y se relanza lo que quede parado.
pve_power_start_timeout: 240

# Margen de cortesía entre un escalón y el siguiente (clave = `order` del que
# acaba de arrancar). Sólo lo usa lo que no tiene una señal propia que consultar:
# los equipos de red esperan a que su API conteste de verdad.
pve_power_gap_after:
  1: 10

# Cuánto se espera a que un escalón de RouterOS levante de verdad y conteste su
# API: un CHR tarda decenas de segundos en levantar RouterOS.
pve_power_ready_timeout: 180

# ============================================================================
# RETENCIÓN DE logs/ — el único directorio del repositorio que crece solo.
# ============================================================================
pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
